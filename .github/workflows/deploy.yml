name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push waits for the running deploy instead of overlapping it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/mavlit test
      - run: pnpm run typecheck:libs   # the frontend typecheck reads these built type files
      - run: pnpm --filter @workspace/mavlit typecheck
      - run: pnpm --filter @workspace/api-server test:proxy

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Run the deploy script on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes root@"$HOST" 'bash /opt/Brand-Deal-Pro-2/scripts/deploy.sh'
